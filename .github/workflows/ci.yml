name: RDP Access
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  setup-rdp:
    runs-on: windows-latest
    steps:
    - name: Enable Long Path Support
      run: |
        reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
    
    # Setup RDP access
    - name: Download ngrok
      run: Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
    - name: Extract ngrok
      run: Expand-Archive ngrok.zip
    - name: Auth ngrok
      run: .\ngrok\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
    - name: Enable TS
      run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
    - name: Allow RDP Through Firewall
      run: Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Require NLA
      run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
    - name: Reset runneradmin Password
      run: Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)
    
    # Start ngrok tunnel and keep session alive
    - name: Start RDP Tunnel
      run: |
        # Start ngrok tunnel in background and capture output
        Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp", "3389" -WindowStyle Hidden
        Start-Sleep -Seconds 15
        
        # Get ngrok tunnel info
        try {
          $ngrokApi = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
          $tunnelUrl = $ngrokApi.tunnels[0].public_url
          Write-Host "=== RDP TUNNEL ACTIVE ==="
          Write-Host "Tunnel URL: $tunnelUrl"
          Write-Host "Username: runneradmin"
          Write-Host "Password: P@ssw0rd!"
          Write-Host "=========================="
        } catch {
          Write-Host "Could not get tunnel URL from API, check ngrok dashboard"
          Write-Host "=== RDP TUNNEL ACTIVE ==="
          Write-Host "Check ngrok dashboard for connection details"
          Write-Host "Username: runneradmin"
          Write-Host "Password: P@ssw0rd!"
          Write-Host "=========================="
        }
        
        # Keep the session alive with more frequent checks
        $startTime = Get-Date
        while ($true) {
          Start-Sleep -Seconds 180  # Check every 3 minutes instead of 5
          $elapsed = (Get-Date) - $startTime
          
          # Check if ngrok is still running
          $ngrokProcess = Get-Process -Name "ngrok" -ErrorAction SilentlyContinue
          if ($ngrokProcess) {
            Write-Host "RDP session active... Elapsed time: $($elapsed.ToString('hh\:mm\:ss')) | Ngrok PID: $($ngrokProcess.Id)"
            
            # Try to get current tunnel status
            try {
              $ngrokStatus = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction SilentlyContinue
              if ($ngrokStatus.tunnels.Count -gt 0) {
                Write-Host "Tunnel status: Connected"
              } else {
                Write-Host "Warning: No active tunnels found"
              }
            } catch {
              Write-Host "Could not check tunnel status"
            }
          } else {
            Write-Host "ERROR: Ngrok process not found! Attempting to restart..."
            Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp", "3389" -WindowStyle Hidden
            Start-Sleep -Seconds 15
          }
          
          # Also check RDP service
          $rdpService = Get-Service -Name "TermService" -ErrorAction SilentlyContinue
          if ($rdpService -and $rdpService.Status -eq "Running") {
            Write-Host "RDP service: Running"
          } else {
            Write-Host "Warning: RDP service not running properly"
          }
        }
    
    # Stop RDP tunnel
    - name: Stop RDP Tunnel
      if: always()
      run: |
        Write-Host "Closing RDP tunnel..."
        Stop-Process -Name "ngrok" -Force -ErrorAction SilentlyContinue
        Write-Host "RDP tunnel closed."
